<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal background -->
  <rect width="600" height="300" rx="10" fill="rgba(15, 20, 30, 0.7)" />
  <rect x="1" y="1" width="598" height="298" rx="9" stroke="rgba(100, 120, 140, 0.2)" stroke-width="1" />
  
  <!-- Terminal header -->
  <rect x="0" y="0" width="600" height="30" rx="10 10 0 0" fill="rgba(30, 40, 55, 0.8)" />
  
  <!-- Terminal buttons -->
  <circle cx="20" cy="15" r="6" fill="#FF5F56" />
  <circle cx="45" cy="15" r="6" fill="#FFBD2E" />
  <circle cx="70" cy="15" r="6" fill="#27C93F" />
  
  <!-- Terminal title -->
  <text x="300" y="20" fill="#a0b4cc" font-family="monospace" font-size="12" text-anchor="middle">sandith@portfolio:~/projects</text>
  
  <!-- Terminal content -->
  <text x="20" y="50" fill="#a0b4cc" font-family="monospace" font-size="14">$</text>
  <text x="40" y="50" fill="#a0b4cc" font-family="monospace" font-size="14" class="typing-animation">whoami</text>
  <text x="20" y="75" fill="#e2e8f0" font-family="monospace" font-size="14">Sandith Sithmaka Thenuwara - Computer Science Student</text>
  
  <text x="20" y="105" fill="#a0b4cc" font-family="monospace" font-size="14">$</text>
  <text x="40" y="105" fill="#a0b4cc" font-family="monospace" font-size="14" class="typing-animation">ls -la skills/</text>
  
  <text x="20" y="130" fill="#e2e8f0" font-family="monospace" font-size="14">drwxr-xr-x frontend/</text>
  <text x="20" y="150" fill="#e2e8f0" font-family="monospace" font-size="14">drwxr-xr-x backend/</text>
  <text x="20" y="170" fill="#e2e8f0" font-family="monospace" font-size="14">drwxr-xr-x databases/</text>
  <text x="20" y="190" fill="#e2e8f0" font-family="monospace" font-size="14">drwxr-xr-x tools/</text>
  
  <text x="20" y="220" fill="#a0b4cc" font-family="monospace" font-size="14">$</text>
  <text x="40" y="220" fill="#a0b4cc" font-family="monospace" font-size="14" class="typing-animation">find . -name "latest_project"</text>
  
  <text x="20" y="245" fill="#e2e8f0" font-family="monospace" font-size="14">./projects/DoctorAid</text>
  
  <text x="20" y="275" fill="#a0b4cc" font-family="monospace" font-size="14">$</text>
  <text x="40" y="275" fill="#a0b4cc" font-family="monospace" font-size="14" class="cursor-animation">_</text>
  
  <!-- Add animations -->
  <style>
    @keyframes typing1 {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes cursor-blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    
    .typing-animation {
      animation: typing1 1.5s steps(10, end);
    }
    
    .cursor-animation {
      animation: cursor-blink 1s infinite;
    }
  </style>
</svg>